# Fetches the day's rates into Supabase three times a day (Manorama updates
# in the morning IST; the extra runs catch late edits — upserts are harmless).
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
name: Fetch market rates

on:
  schedule:
    - cron: "0 3 * * *"    # 08:30 IST
    - cron: "0 7 * * *"    # 12:30 IST
    - cron: "0 13 * * *"   # 18:30 IST
  workflow_dispatch:
    inputs:
      backfill_since:
        description: "Also backfill from the Internet Archive since this date (YYYY-MM-DD); leave empty to skip"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch today's rates
        run: python fetch.py
      - name: Backfill history
        if: ${{ github.event.inputs.backfill_since != '' }}
        run: python backfill.py --since "${{ github.event.inputs.backfill_since }}"
